spring.application.name=restaurant-api
spring.config.import=optional:file:backend/.env[.properties],optional:file:.env[.properties]
server.port=${PORT:5000}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/restaurant_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
management.endpoints.web.exposure.include=health,info
app.frontend-origins=${FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.cookie-secure=${COOKIE_SECURE:false}
app.session-hours=${SESSION_HOURS:12}
app.payments-mode=${PAYMENTS_MODE:demo}
app.admin-username=${ADMIN_USERNAME:}
app.admin-password=${ADMIN_PASSWORD:}
